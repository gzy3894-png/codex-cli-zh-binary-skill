name: Build Codex for TUI

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build release APK artifact"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - android-arm64-musl-installer
    tags:
      - "codex-for-tui-v*"
    paths:
      - "android-app/**"
      - "android-arm64-musl/**"
      - "tests/**"
      - ".github/workflows/build-codex-for-tui.yml"

jobs:
  script-smoke:
    name: Script smoke and static guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test installer scripts
        run: sh tests/codex-for-tui-installer-smoke.sh

      - name: Static guard tests
        run: sh tests/codex-for-tui-static-guards.sh

      - name: Config manager smoke tests
        run: sh tests/codex-for-tui-config-smoke.sh

      - name: Dev transfer smoke tests
        run: |
          sh tests/codex-for-tui-dev-transfer-smoke.sh
          sh tests/codex-for-tui-dev-transfer-security-smoke.sh

      - name: Device smoke script syntax
        run: sh -n tests/codex-for-tui-device-smoke.sh

  rtk-arm64-musl:
    name: Build RTK aarch64 musl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RTK
        uses: actions/checkout@v4
        with:
          repository: rtk-ai/rtk
          ref: v0.43.0
          path: rtk-src

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          cargo install cross --locked

      - name: Build RTK
        working-directory: rtk-src
        run: cross build --release --target aarch64-unknown-linux-musl

      - name: Verify RTK under qemu
        run: |
          cp rtk-src/target/aarch64-unknown-linux-musl/release/rtk /tmp/rtk
          chmod 755 /tmp/rtk
          qemu-aarch64 /tmp/rtk --version

      - name: Upload RTK binary
        uses: actions/upload-artifact@v4
        with:
          name: rtk-aarch64-unknown-linux-musl
          path: /tmp/rtk
          if-no-files-found: error

  android-debug-build:
    name: Build test APK
    runs-on: ubuntu-latest
    needs:
      - script-smoke
      - rtk-arm64-musl
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-app/**/*.gradle*
            android-app/**/gradle-wrapper.properties
            android-app/gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.13846066"
          yes | sdkmanager --licenses

      - name: Add RTK binary asset
        uses: actions/download-artifact@v4
        with:
          name: rtk-aarch64-unknown-linux-musl
          path: /tmp/codex-for-tui-rtk

      - name: Install RTK binary asset
        run: |
          cp /tmp/codex-for-tui-rtk/rtk core/main/src/main/assets/rtk
          chmod 755 core/main/src/main/assets/rtk
          test -s core/main/src/main/assets/rtk

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Build test APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-for-tui-test-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-release-build:
    name: Build release APK
    runs-on: ubuntu-latest
    needs:
      - script-smoke
      - rtk-arm64-musl
    if: ${{ startsWith(github.ref, 'refs/tags/codex-for-tui-v') || github.event.inputs.build_release == 'true' }}
    defaults:
      run:
        working-directory: android-app
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      CODEX_TUI_RELEASE_CERT_SHA256: a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc
      CODEX_TUI_EXPECTED_PACKAGE_NAME: com.gzy3894.codexfortui
      CODEX_TUI_EXPECTED_VERSION_CODE: "52"
      CODEX_TUI_EXPECTED_VERSION_NAME: 2.3.9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version inputs
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(
            sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts \
              | tail -n 1
          )"
          if [ "$version_name" != "$CODEX_TUI_EXPECTED_VERSION_NAME" ]; then
            echo "Gradle versionName mismatch: expected $CODEX_TUI_EXPECTED_VERSION_NAME, got $version_name" >&2
            exit 1
          fi
          version_code="$(
            sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts \
              | tail -n 1
          )"
          if [ "$version_code" != "$CODEX_TUI_EXPECTED_VERSION_CODE" ]; then
            echo "Gradle versionCode mismatch: expected $CODEX_TUI_EXPECTED_VERSION_CODE, got $version_code" >&2
            exit 1
          fi
          package_name="$(
            sed -n 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts \
              | tail -n 1
          )"
          if [ "$package_name" != "$CODEX_TUI_EXPECTED_PACKAGE_NAME" ]; then
            echo "Gradle applicationId mismatch: expected $CODEX_TUI_EXPECTED_PACKAGE_NAME, got $package_name" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/codex-for-tui-v* ]]; then
            tag_version="${GITHUB_REF_NAME#codex-for-tui-v}"
            if [ "$tag_version" != "$CODEX_TUI_EXPECTED_VERSION_NAME" ]; then
              echo "Tag/versionName mismatch: tag=$tag_version versionName=$CODEX_TUI_EXPECTED_VERSION_NAME" >&2
              exit 1
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-app/**/*.gradle*
            android-app/**/gradle-wrapper.properties
            android-app/gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.13846066"
          yes | sdkmanager --licenses

      - name: Add RTK binary asset
        uses: actions/download-artifact@v4
        with:
          name: rtk-aarch64-unknown-linux-musl
          path: /tmp/codex-for-tui-rtk

      - name: Install RTK binary asset
        run: |
          cp /tmp/codex-for-tui-rtk/rtk core/main/src/main/assets/rtk
          chmod 755 core/main/src/main/assets/rtk
          test -s core/main/src/main/assets/rtk

      - name: Prepare release signing key
        id: release-signing
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD ANDROID_RELEASE_STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release signing secrets are required; repository/test keystore fallback is forbidden." >&2
            exit 1
          fi
          if ! printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/xed.keystore; then
            echo "ANDROID_RELEASE_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          test -s /tmp/xed.keystore || {
            echo "Decoded release keystore is empty." >&2
            exit 1
          }
          {
            printf 'storeFile=%s\n' "/tmp/xed.keystore"
            printf 'keyAlias=%s\n' "$ANDROID_RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD"
            printf 'storePassword=%s\n' "$ANDROID_RELEASE_STORE_PASSWORD"
          } > /tmp/signing.properties
          chmod 600 /tmp/xed.keystore /tmp/signing.properties
          echo "Using configured GitHub Secrets release signing key."
          echo "artifact_name=codex-for-tui-release-apk" >> "$GITHUB_OUTPUT"

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release APKs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APK found" >&2
            exit 1
          fi

          apksigner="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(command -v apksigner || true)"
          fi
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          aapt="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/36.0.0/aapt"
          if [ ! -x "$aapt" ]; then
            aapt="$(command -v aapt || true)"
          fi
          if [ -z "$aapt" ] || [ ! -x "$aapt" ]; then
            echo "aapt not found" >&2
            exit 1
          fi

          expected="$(printf '%s' "$CODEX_TUI_RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          certs_file="$(mktemp)"
          badging_file="$(mktemp)"
          trap 'rm -f "$certs_file" "$badging_file"' EXIT
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$apksigner" verify --print-certs "$apk" | tee "$certs_file"
            actual="$(
              awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' "$certs_file" \
                | tr '[:upper:]' '[:lower:]' \
                | tr -d ':[:space:]'
            )"
            if [ -z "$actual" ]; then
              echo "Could not read release certificate SHA-256 digest for $apk" >&2
              exit 1
            fi
            if [ "$actual" != "$expected" ]; then
              echo "Release APK signing certificate mismatch for $apk" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 1
            fi
            "$aapt" dump badging "$apk" > "$badging_file"
            apk_version="$(
              sed -n "s/^package: .*versionName='\\([^']*\\)'.*/\\1/p" "$badging_file" \
                | head -n 1
            )"
            apk_version_code="$(
              sed -n "s/^package: .*versionCode='\\([^']*\\)'.*/\\1/p" "$badging_file" \
                | head -n 1
            )"
            apk_package="$(
              sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" "$badging_file" \
                | head -n 1
            )"
            if [ "$apk_package" != "$CODEX_TUI_EXPECTED_PACKAGE_NAME" ]; then
              echo "Release APK packageName mismatch for $apk: expected $CODEX_TUI_EXPECTED_PACKAGE_NAME, got $apk_package" >&2
              exit 1
            fi
            if [ "$apk_version_code" != "$CODEX_TUI_EXPECTED_VERSION_CODE" ]; then
              echo "Release APK versionCode mismatch for $apk: expected $CODEX_TUI_EXPECTED_VERSION_CODE, got $apk_version_code" >&2
              exit 1
            fi
            if [ "$apk_version" != "$CODEX_TUI_EXPECTED_VERSION_NAME" ]; then
              echo "Release APK versionName mismatch for $apk: expected $CODEX_TUI_EXPECTED_VERSION_NAME, got $apk_version" >&2
              exit 1
            fi
            if grep -qx 'application-debuggable' "$badging_file"; then
              echo "Release APK must not be debuggable: $apk" >&2
              exit 1
            fi
            echo "Release APK verified: cert=$actual packageName=$apk_package versionCode=$apk_version_code versionName=$apk_version debuggable=false"
          done

      - name: Generate release SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-signing.outputs.artifact_name }}
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error

      - name: Upload GitHub release assets
        if: ${{ startsWith(github.ref, 'refs/tags/codex-for-tui-v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/apk/release/SHA256SUMS
