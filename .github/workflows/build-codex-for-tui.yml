name: Build Codex for TUI

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build release APK artifact"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - android-arm64-musl-installer
    tags:
      - "codex-for-tui-v*"
    paths:
      - "android-app/**"
      - "android-arm64-musl/**"
      - "tests/**"
      - ".github/workflows/build-codex-for-tui.yml"

jobs:
  script-smoke:
    name: Script smoke and static guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test installer scripts
        run: sh tests/codex-for-tui-installer-smoke.sh

      - name: Static guard tests
        run: sh tests/codex-for-tui-static-guards.sh

      - name: Device smoke script syntax
        run: sh -n tests/codex-for-tui-device-smoke.sh

  android-debug-build:
    name: Build test APK
    runs-on: ubuntu-latest
    needs: script-smoke
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-app/**/*.gradle*
            android-app/**/gradle-wrapper.properties
            android-app/gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.13846066"
          yes | sdkmanager --licenses

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Build test APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-for-tui-test-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-release-build:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: script-smoke
    if: ${{ startsWith(github.ref, 'refs/tags/codex-for-tui-v') || github.event.inputs.build_release == 'true' }}
    defaults:
      run:
        working-directory: android-app
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      CODEX_TUI_RELEASE_CERT_SHA256: a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-app/**/*.gradle*
            android-app/**/gradle-wrapper.properties
            android-app/gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.13846066"
          yes | sdkmanager --licenses

      - name: Prepare release signing if secrets exist
        id: release-signing
        shell: bash
        run: |
          if [ -n "$ANDROID_RELEASE_KEYSTORE_BASE64" ] \
            && [ -n "$ANDROID_RELEASE_KEY_ALIAS" ] \
            && [ -n "$ANDROID_RELEASE_KEY_PASSWORD" ] \
            && [ -n "$ANDROID_RELEASE_STORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/xed.keystore
            {
              printf 'keyAlias=%s\n' "$ANDROID_RELEASE_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD"
              printf 'storePassword=%s\n' "$ANDROID_RELEASE_STORE_PASSWORD"
            } > /tmp/signing.properties
            echo "Using configured release signing key."
          else
            echo "No alternate release signing secrets found; using the repository 2.x release signing key."
          fi
          echo "artifact_name=codex-for-tui-release-apk" >> "$GITHUB_OUTPUT"

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No release APK found" >&2
            exit 1
          fi

          apksigner="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(command -v apksigner || true)"
          fi
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi

          "$apksigner" verify --print-certs "$apk" | tee /tmp/codex-for-tui-release-certs.txt
          actual="$(
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' /tmp/codex-for-tui-release-certs.txt \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d ':[:space:]'
          )"
          expected="$(printf '%s' "$CODEX_TUI_RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ -z "$actual" ]; then
            echo "Could not read release certificate SHA-256 digest" >&2
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "Release APK signing certificate mismatch" >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi
          echo "Release APK signing certificate verified: $actual"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-signing.outputs.artifact_name }}
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
